---
deployment:
  tasks:
    - export DEPLOYPATH=/home/CRBUSERNAME/public_html/
    - /bin/cp -R app bootstrap config database public resources routes storage vendor artisan composer.json composer.lock $DEPLOYPATH
    - /bin/cp .env.production $DEPLOYPATH/.env
    - cd $DEPLOYPATH
    - /usr/local/bin/php artisan migrate --force
    - /usr/local/bin/php artisan config:cache
    - /usr/local/bin/php artisan route:cache
    - /usr/local/bin/php artisan view:cache
    - /bin/chmod -R 775 storage
    - /bin/chmod -R 775 bootstrap/cache
