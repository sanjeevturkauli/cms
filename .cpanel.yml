---
deployment:
  tasks:
    - export APPPATH=/home/crbvnago/repositories/cms
    - export DEPLOYPATH=/home/crbvnago/public_html

    # Copy only public files
    - /bin/cp -R $APPPATH/public/* $DEPLOYPATH

    # Set permissions
    - /bin/chmod -R 775 $APPPATH/storage
    - /bin/chmod -R 775 $APPPATH/bootstrap/cache
