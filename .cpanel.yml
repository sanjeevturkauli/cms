deployment:
  tasks:
    - export APPPATH=/home/crbvnago/repositories/cms
    - export DEPLOYPATH=/home/crbvnago/public_html

    # Copy everything but don't delete first
    - /bin/cp -R $APPPATH/* $DEPLOYPATH/

    # Fix permissions
    - /bin/chmod -R 775 $DEPLOYPATH/storage || true
    - /bin/chmod -R 775 $DEPLOYPATH/bootstrap/cache || true
